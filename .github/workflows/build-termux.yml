name: Build native OpenCode for Termux

on:
  workflow_dispatch:
    inputs:
      version:
        description: "OpenCode version (pinned to 1.19.3)"
        required: true
        default: "1.19.3"

permissions:
  contents: read

concurrency:
  group: termux-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_VERSION: ${{ inputs.version }}
      NATIVE_BUILD_REPO: bd-loser/opencode-bionic
      NATIVE_BUILD_COMMIT: 52c794391531fe18469bcb435ba910057161b4a8
      OPENTUI_NATIVE_VERSION: "0.5.17"
      NATIVE_BINARY_SHA256: b7a4c266988700732164fa6c02396ae805dc6bab3bfcbb790a5a632fcf71fa0f
      SOURCE_MANIFEST_SHA256: 13524f82c663a038085d9344213de2295bfff1a9069b5ce50c58528443793e80
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Validate pinned target
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$TARGET_VERSION" != "1.19.3" ]]; then
            echo "::error::This workflow is intentionally pinned to OpenCode 1.19.3."
            exit 1
          fi

      - name: Install verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl file binutils jq coreutils

      - name: Verify source tag and component pins
        shell: bash
        run: |
          set -euo pipefail
          TAG_JSON="$(curl -fsSL --retry 3 --retry-all-errors \
            "https://api.github.com/repos/$NATIVE_BUILD_REPO/git/ref/tags/v$TARGET_VERSION")"
          TAG_COMMIT="$(jq -r '.object.sha' <<< "$TAG_JSON")"
          if [[ "$TAG_COMMIT" != "$NATIVE_BUILD_COMMIT" ]]; then
            echo "::error::Native source tag moved: expected $NATIVE_BUILD_COMMIT, got $TAG_COMMIT"
            exit 1
          fi

          curl -fsSL --retry 3 --retry-all-errors \
            "https://raw.githubusercontent.com/$NATIVE_BUILD_REPO/v$TARGET_VERSION/versions.json" \
            -o source-versions.json
          jq -e --arg ver "$TARGET_VERSION" --arg tui "$OPENTUI_NATIVE_VERSION" \
            '.opencode == $ver and .opentui.androidArm64Native == $tui and .opentui.core == $tui' \
            source-versions.json >/dev/null
          cat source-versions.json

      - name: Download pinned native Android/Bionic binary
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_URL="https://github.com/$NATIVE_BUILD_REPO/releases/download/v$TARGET_VERSION"
          curl -fL --retry 3 --retry-all-errors "$RELEASE_URL/opencode" -o opencode-native
          curl -fL --retry 3 --retry-all-errors "$RELEASE_URL/SHA256SUMS" -o source-release-SHA256SUMS

          # Pin both the upstream manifest and the actual binary digest. This
          # fails closed if a release asset is replaced or its checksums drift.
          printf '%s  source-release-SHA256SUMS\n' "$SOURCE_MANIFEST_SHA256" | sha256sum --check --strict
          MANIFEST_BINARY_SHA="$(awk '$2 == "opencode" || $2 == "*opencode" { print $1; exit }' source-release-SHA256SUMS)"
          if [[ "$MANIFEST_BINARY_SHA" != "$NATIVE_BINARY_SHA256" ]]; then
            echo "::error::Source manifest does not match the pinned native binary hash."
            exit 1
          fi
          printf '%s  opencode-native\n' "$NATIVE_BINARY_SHA256" | sha256sum --check --strict
          chmod 755 opencode-native
          test "$(stat -c '%s' opencode-native)" -gt 50000000

      - name: Verify ELF and glibc compatibility
        shell: bash
        run: |
          set -euo pipefail
          file opencode-native | tee elf-file.txt
          readelf -h opencode-native | tee elf-header.txt
          grep -q 'AArch64' elf-header.txt

          readelf -l opencode-native | tee elf-program-headers.txt
          INTERPRETER="$(sed -n 's/^.*Requesting program interpreter: \(.*\)]$/\1/p' elf-program-headers.txt | head -n1)"
          if [[ "$INTERPRETER" != "/system/bin/linker64" ]]; then
            echo "::error::Expected Android/Bionic PT_INTERP /system/bin/linker64, got: ${INTERPRETER:-<missing>}"
            exit 1
          fi

          readelf -d opencode-native | tee elf-dynamic.txt
          if grep -Eq 'Shared library: \[(libc\.so\.6|libm\.so\.6|libdl\.so\.2|libpthread\.so\.0|librt\.so\.1|ld-linux[^]]*)\]' elf-dynamic.txt; then
            echo "::error::The main ELF still has glibc dependencies."
            exit 1
          fi

          strings -a opencode-native | grep -Fq "$TARGET_VERSION"
          strings -a opencode-native | grep -Fq 'libopentui.so'
          sha256sum opencode-native

      - name: Write build provenance report
        shell: bash
        run: |
          set -euo pipefail
          INTERPRETER="$(sed -n 's/^.*Requesting program interpreter: \(.*\)]$/\1/p' elf-program-headers.txt | head -n1)"
          jq -n \
            --arg version "$TARGET_VERSION" \
            --arg source_repo "$NATIVE_BUILD_REPO" \
            --arg source_tag "v$TARGET_VERSION" \
            --arg source_commit "$NATIVE_BUILD_COMMIT" \
            --arg source_sha256 "$NATIVE_BINARY_SHA256" \
            --arg manifest_sha256 "$SOURCE_MANIFEST_SHA256" \
            --arg opentui_version "$OPENTUI_NATIVE_VERSION" \
            --arg interpreter "$INTERPRETER" \
            '{
              version: $version,
              build_method: "package a pinned prebuilt Android/Bionic ELF; do not transplant the glibc Linux binary",
              source: {
                repository: $source_repo,
                tag: $source_tag,
                commit: $source_commit,
                asset: "opencode",
                sha256: $source_sha256,
                checksum_manifest_sha256: $manifest_sha256
              },
              components: {
                opencode_upstream: $version,
                androidtui_core_android_arm64: $opentui_version,
                bun_termux: "1.4.3-patched"
              },
              checks: {
                source_manifest_digest: "passed",
                native_binary_digest: "passed",
                elf_machine: "AArch64",
                elf_interpreter: $interpreter,
                main_elf_glibc_needed: false,
                embedded_version_marker: "passed",
                embedded_opentui_marker: "passed"
              },
              runtime_acceptance: "not executed on Linux CI; verify TUI on a real Termux ARM64 device"
            }' > build-report.json
          cat build-report.json
          sha256sum opencode-native > SHA256SUMS
          printf 'OpenCode version: %s\nNative source: https://github.com/%s/releases/tag/v%s\nSource commit: %s\nSource binary SHA-256: %s\nBionic OpenTUI: %s\n' \
            "$TARGET_VERSION" "$NATIVE_BUILD_REPO" "$TARGET_VERSION" "$NATIVE_BUILD_COMMIT" \
            "$NATIVE_BINARY_SHA256" "$OPENTUI_NATIVE_VERSION" > BUILD-INFO.txt

      - name: Assemble installable artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/scripts
          cp opencode-native SHA256SUMS BUILD-INFO.txt build-report.json \
            source-release-SHA256SUMS source-versions.json \
            elf-file.txt elf-header.txt elf-program-headers.txt elf-dynamic.txt dist/
          cp install-termux.sh dist/
          cp scripts/termux-launcher.sh dist/scripts/
          chmod 755 dist/install-termux.sh dist/scripts/termux-launcher.sh
          tar -czf "opencode-termux-v$TARGET_VERSION.tar.gz" -C dist .
          sha256sum "opencode-termux-v$TARGET_VERSION.tar.gz" > "opencode-termux-v$TARGET_VERSION.tar.gz.sha256"

      - name: Upload verified native binary package
        uses: actions/upload-artifact@v4
        with:
          name: opencode-termux-v${{ inputs.version }}
          path: |
            opencode-termux-v${{ inputs.version }}.tar.gz
            opencode-termux-v${{ inputs.version }}.tar.gz.sha256
            build-report.json
            elf-header.txt
            elf-program-headers.txt
            elf-dynamic.txt
          if-no-files-found: error
          retention-days: 30
